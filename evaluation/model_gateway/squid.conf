http_port 3128

acl internal_clients src 172.16.0.0/12
acl connect_method method CONNECT
acl tls_port port 443
acl allowed_domains dstdomain ai.chipcloud.cc token-plan.cn-beijing.maas.aliyuncs.com

http_access deny !internal_clients
http_access deny !connect_method
http_access deny CONNECT !tls_port
http_access allow allowed_domains
http_access deny all

dns_v4_first on
cache deny all
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all

access_log stdio:/dev/stdout
cache_log /dev/stderr
coredump_dir /tmp
visible_hostname model-egress
pid_filename none
