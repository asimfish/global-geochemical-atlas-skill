<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Q24 interactive geochemical map</title>
<style>body{font:14px system-ui;margin:16px;color:#172033}canvas{border:1px solid #94a3b8;background:#f8fafc}button,label{margin:0 6px 8px 0}pre{max-width:900px;background:#f1f5f9;padding:8px;min-height:48px}</style></head>
<body><h1>Q24 端到端小型地球化学图谱</h1>
<p>合成微型基准；统计异常仅为相对富集/亏损筛查，不建立成因。</p>
<div><button onclick="zoomBy(1.3)">放大 +</button><button onclick="zoomBy(0.77)">缩小 −</button>
<button onclick="pan(-20,0)">←</button><button onclick="pan(20,0)">→</button><button onclick="resetView()">重置</button>
<label><input id="showAnom" type="checkbox" checked onchange="draw()">候选异常</label></div>
<canvas id="stage" width="900" height="450" tabindex="0"></canvas><div id="status"></div><pre id="detail">点击样点查看 record_id 与 source_id</pre>
<script>var POINTS={"features":[{"geometry":{"coordinates":[-100.01,30.01],"type":"Point"},"id":"E01","properties":{"element":"Cu","normalized_unit":"mg/kg","normalized_value":20,"qc_flags":[],"qualifier":"=","record_id":"E01","source_id":"SRC-A"},"type":"Feature"},{"geometry":{"coordinates":[-100.02,30.02],"type":"Point"},"id":"E02","properties":{"element":"Cu","normalized_unit":"mg/kg","normalized_value":21,"qc_flags":[],"qualifier":"=","record_id":"E02","source_id":"SRC-A"},"type":"Feature"},{"geometry":{"coordinates":[-100.03,30.03],"type":"Point"},"id":"E03","properties":{"element":"Cu","normalized_unit":"mg/kg","normalized_value":22,"qc_flags":[],"qualifier":"=","record_id":"E03","source_id":"SRC-A"},"type":"Feature"},{"geometry":{"coordinates":[-100.04,30.04],"type":"Point"},"id":"E04","properties":{"element":"Cu","normalized_unit":"mg/kg","normalized_value":23,"qc_flags":[],"qualifier":"=","record_id":"E04","source_id":"SRC-A"},"type":"Feature"},{"geometry":{"coordinates":[-100.05,30.05],"type":"Point"},"id":"E05","properties":{"element":"Cu","normalized_unit":"mg/kg","normalized_value":24,"qc_flags":[],"qualifier":"=","record_id":"E05","source_id":"SRC-A"},"type":"Feature"},{"geometry":{"coordinates":[-100.06,30.06],"type":"Point"},"id":"E06","properties":{"element":"Cu","normalized_unit":"mg/kg","normalized_value":25,"qc_flags":[],"qualifier":"=","record_id":"E06","source_id":"SRC-A"},"type":"Feature"},{"geometry":{"coordinates":[-100.07,30.07],"type":"Point"},"id":"E07","properties":{"element":"Cu","normalized_unit":"mg/kg","normalized_value":26,"qc_flags":[],"qualifier":"=","record_id":"E07","source_id":"SRC-A"},"type":"Feature"},{"geometry":{"coordinates":[-100.08,30.08],"type":"Point"},"id":"E08","properties":{"element":"Cu","normalized_unit":"mg/kg","normalized_value":27,"qc_flags":[],"qualifier":"=","record_id":"E08","source_id":"SRC-A"},"type":"Feature"},{"geometry":{"coordinates":[-100.09,30.09],"type":"Point"},"id":"E09","properties":{"element":"Cu","normalized_unit":"mg/kg","normalized_value":28,"qc_flags":[],"qualifier":"=","record_id":"E09","source_id":"SRC-A"},"type":"Feature"},{"geometry":{"coordinates":[-100.1,30.1],"type":"Point"},"id":"E10","properties":{"element":"Cu","normalized_unit":"mg/kg","normalized_value":29,"qc_flags":[],"qualifier":"=","record_id":"E10","source_id":"SRC-A"},"type":"Feature"},{"geometry":{"coordinates":[-100.11,30.11],"type":"Point"},"id":"E11","properties":{"element":"Cu","normalized_unit":"mg/kg","normalized_value":30,"qc_flags":[],"qualifier":"=","record_id":"E11","source_id":"SRC-A"},"type":"Feature"},{"geometry":{"coordinates":[-100.12,30.12],"type":"Point"},"id":"E12","properties":{"element":"Cu","normalized_unit":"mg/kg","normalized_value":31,"qc_flags":[],"qualifier":"=","record_id":"E12","source_id":"SRC-A"},"type":"Feature"},{"geometry":{"coordinates":[-100.13,30.13],"type":"Point"},"id":"E13","properties":{"element":"Cu","normalized_unit":"mg/kg","normalized_value":32,"qc_flags":[],"qualifier":"=","record_id":"E13","source_id":"SRC-A"},"type":"Feature"},{"geometry":{"coordinates":[-100.14,30.14],"type":"Point"},"id":"E14","properties":{"element":"Cu","normalized_unit":"mg/kg","normalized_value":33,"qc_flags":[],"qualifier":"=","record_id":"E14","source_id":"SRC-A"},"type":"Feature"},{"geometry":{"coordinates":[-100.15,30.15],"type":"Point"},"id":"E15","properties":{"element":"Cu","normalized_unit":"mg/kg","normalized_value":34,"qc_flags":[],"qualifier":"=","record_id":"E15","source_id":"SRC-A"},"type":"Feature"},{"geometry":{"coordinates":[-100.16,30.16],"type":"Point"},"id":"E16","properties":{"element":"Cu","normalized_unit":"mg/kg","normalized_value":35,"qc_flags":[],"qualifier":"=","record_id":"E16","source_id":"SRC-A"},"type":"Feature"},{"geometry":{"coordinates":[-100.17,30.17],"type":"Point"},"id":"E17","properties":{"element":"Cu","normalized_unit":"mg/kg","normalized_value":36,"qc_flags":[],"qualifier":"=","record_id":"E17","source_id":"SRC-A"},"type":"Feature"},{"geometry":{"coordinates":[-100.18,30.18],"type":"Point"},"id":"E18","properties":{"element":"Cu","normalized_unit":"mg/kg","normalized_value":37,"qc_flags":[],"qualifier":"=","record_id":"E18","source_id":"SRC-A"},"type":"Feature"},{"geometry":{"coordinates":[-100.19,30.19],"type":"Point"},"id":"E19","properties":{"element":"Cu","normalized_unit":"mg/kg","normalized_value":38,"qc_flags":[],"qualifier":"=","record_id":"E19","source_id":"SRC-A"},"type":"Feature"},{"geometry":{"coordinates":[-100.2,30.2],"type":"Point"},"id":"E20","properties":{"element":"Cu","normalized_unit":"mg/kg","normalized_value":39,"qc_flags":[],"qualifier":"=","record_id":"E20","source_id":"SRC-A"},"type":"Feature"},{"geometry":{"coordinates":[-100.21,30.21],"type":"Point"},"id":"E21","properties":{"element":"Cu","normalized_unit":"mg/kg","normalized_value":500,"qc_flags":[],"qualifier":"=","record_id":"E21","source_id":"SRC-A"},"type":"Feature"},{"geometry":{"coordinates":[-101,31],"type":"Point"},"id":"E22","properties":{"element":"Cu","normalized_unit":"mg/kg","normalized_value":null,"qc_flags":["left_censored"],"qualifier":"<","record_id":"E22","source_id":"SRC-A"},"type":"Feature"},{"geometry":{"coordinates":[-104,33],"type":"Point"},"id":"E25","properties":{"element":"Pb","normalized_unit":"ug/L","normalized_value":20,"qc_flags":["insufficient_group_size"],"qualifier":"=","record_id":"E25","source_id":"SRC-A"},"type":"Feature"}],"type":"FeatureCollection"};var ANOMALIES={"features":[{"geometry":{"coordinates":[-100.21,30.21],"type":"Point"},"id":"E21","properties":{"anomaly_type":"statistical_relative_enrichment","center_log10":1.4771212547,"group_id":"soil|dry|total|Cu|ICP-MS","n":21,"record_id":"E21","robust_z":10.4080919691,"scale_log10":0.1173941154,"source_id":"SRC-A"},"type":"Feature"}],"type":"FeatureCollection"};var W=900,H=450,scale=1,cx=0,cy=0;
var canvas=document.getElementById('stage'),ctx=canvas.getContext('2d');
function proj(lon,lat){return [W/2+(lon-cx)*W/360*scale,H/2-(lat-cy)*H/180*scale]}
function draw(){ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#cbd5e1';ctx.lineWidth=1;
for(let lon=-180;lon<=180;lon+=30){let a=proj(lon,-90),b=proj(lon,90);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}
for(let lat=-90;lat<=90;lat+=30){let a=proj(-180,lat),b=proj(180,lat);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}
ctx.fillStyle='#2563eb';for(const f of POINTS.features){let p=proj(...f.geometry.coordinates);ctx.beginPath();ctx.arc(...p,4,0,Math.PI*2);ctx.fill()}
if(document.getElementById('showAnom').checked){ctx.strokeStyle='#dc2626';ctx.lineWidth=2;for(const f of ANOMALIES.features){let p=proj(...f.geometry.coordinates);ctx.beginPath();ctx.arc(...p,9,0,Math.PI*2);ctx.stroke()}}
document.getElementById('status').textContent=`mapped_features=${POINTS.features.length} · anomalies=${ANOMALIES.features.length} · scale=${scale.toFixed(2)}`;}
function zoomBy(v){scale=Math.max(.5,Math.min(50,scale*v));draw()}function pan(x,y){cx+=x/scale;cy+=y/scale;draw()}function resetView(){scale=1;cx=0;cy=0;draw()}
canvas.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1.15:.87)});
canvas.addEventListener('click',e=>{let r=canvas.getBoundingClientRect(),best=null,dist=14;for(const f of POINTS.features){let p=proj(...f.geometry.coordinates),d=Math.hypot(p[0]-(e.clientX-r.left),p[1]-(e.clientY-r.top));if(d<dist){best=f;dist=d}}document.getElementById('detail').textContent=best?JSON.stringify(best.properties,null,2):'未命中样点';});draw();</script></body></html>
