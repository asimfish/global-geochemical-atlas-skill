name: skill-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate Forge commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess

          pattern = re.compile(
              r"^\[[a-z0-9_/-]+/(feat|fix|refactor|docs|test|chore|perf|style|ci|build|revert)!?\]: .{1,72}$"
          )
          subjects = subprocess.check_output(
              ["git", "log", "--no-merges", "--format=%s", f"{os.environ['BASE_SHA']}..HEAD"],
              text=True,
          ).splitlines()
          invalid = [subject for subject in subjects if not pattern.fullmatch(subject)]
          if invalid:
              raise SystemExit("invalid Forge commit subjects:\n" + "\n".join(invalid))
          PY
      - name: Install static quality gates
        run: >-
          python -m pip install --disable-pip-version-check
          ruff==0.12.0 mypy==1.17.1
      - name: Run static quality gate
        run: |
          ruff check .
          ruff format --check .
          mypy --config-file mypy-critical.ini
      - name: Validate D1 D2 D3 contracts
        run: python skills/global-geochemical-atlas/scripts/component_test.py --component all
      - name: Run deterministic regression suite
        run: python skills/global-geochemical-atlas/scripts/self_test.py
      - name: Test Docker evaluation controller
        run: python -m unittest discover -s evaluation/docker/tests -v
      - name: Test unified evaluation reporting
        run: python -m unittest discover -s evaluation/reporting -p 'test_*.py' -v
      - name: Check autonomous Qwen uplift contracts and source scoring
        run: python -m unittest discover -s evaluation_lyf/agent_uplift -p 'test_*.py' -v
      - name: Verify independent source truth snapshot
        run: |
          python -m unittest discover -s evaluation/tools/tests -p 'test_*.py' -v
          python evaluation/tools/audit_source_truth.py --output /tmp/gga-source-truth.json
      - name: Run L0/L1 deterministic preflight
        shell: bash
        run: |
          set +e
          python evaluation/docker/preflight.py . --output /tmp/gga-preflight.json
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 2
          python - <<'PY'
          import json
          report = json.load(open("/tmp/gga-preflight.json", encoding="utf-8"))
          if report["failures"]:
              raise SystemExit(f"preflight failures: {report['failures']}")
          PY
      - name: Run evaluation_lyf adapter smoke
        run: >-
          python evaluation_lyf/suite_adapter.py
          --suite isolated
          --stress-records 1000
          --timeout-seconds 120
          --output-dir /tmp/gga-suite-adapter
      - name: Run source truth adapter smoke
        run: >-
          python evaluation_lyf/suite_adapter.py
          --suite source-truth
          --timeout-seconds 120
          --output-dir /tmp/gga-source-truth-adapter
      - name: Check every script interface
        shell: bash
        run: |
          set -euo pipefail
          for script in skills/global-geochemical-atlas/scripts/*.py; do
            python "$script" --help >/dev/null
          done
